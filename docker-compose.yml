services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: queueflow
      POSTGRES_PASSWORD: queueflow_dev
      POSTGRES_DB: QueueFlow
    ports:
      - '55432:5432'
    volumes:
      - queueflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U queueflow -d QueueFlow']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: postgresql://queueflow:queueflow_dev@postgres:5432/QueueFlow?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ['npx', 'prisma', 'migrate', 'deploy']

  seed:
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: postgresql://queueflow:queueflow_dev@postgres:5432/QueueFlow?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ['npm', 'run', 'seed']

  api:
    build:
      context: .
      target: runtime
    environment:
      NODE_ENV: development
      PORT: 3000
      API_PREFIX: api
      API_VERSION: 1
      DATABASE_URL: postgresql://queueflow:queueflow_dev@postgres:5432/QueueFlow?schema=public
      REDIS_URL: redis://redis:6379
      REALTIME_REDIS_ADAPTER_ENABLED: 'true'
      JWT_ACCESS_SECRET: local-compose-access-secret-change-me-32
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: local-compose-refresh-secret-change-me-32
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3001
      COOKIE_SECURE: 'false'
      COOKIE_SAME_SITE: lax
      SWAGGER_ENABLED: 'true'
      BULLMQ_PREFIX: queueflow
      NOTIFICATION_JOB_ATTEMPTS: 5
      NOTIFICATION_JOB_BACKOFF_MS: 1000
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  queueflow-postgres:
